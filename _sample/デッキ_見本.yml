# サービスサイトに載せる「ご報告の見本」— 架空データ
#
#   python3 /root/hrp-case/deck_build.py --yml /root/hrpartner-site/_sample/デッキ_見本.yml \
#     --out /root/hrpartner-site/_sample/見本.html --apply --force
#
# 位置づけ: 00_素材棚卸_20260802.md:96 の
#   「サイトに載せる『診断レポートの見本』は…匿名化して使うのが最短」への対応。
#   ただし**実在案件の匿名化ではなく、架空データで新規に組む**。
#   実物 PDF（1.5〜1.9MB）は社名・拠点名・実測値が全面に入っており、
#   塗り潰しでは残留の見落としが起きる。最初から実データを含まないものを作る方が安全。
#
# ⚠ ここに書く数値は**すべて架空**。実在の企業・実測値を1つも含めない。
#   規約7（導入事例・お客様の声は書かない）と規約3（効果を保証しない）に触れないため、
#   画面上にも「架空の例」と明記する。
# ⚠ 「診断」という語は使わない（手順①〜⑫.md:521 鉄則5）。「ご報告」と呼ぶ。

title: ご報告の見本（架空の例）

decks:
  - eyebrow: 見本
    heading: ご報告の見本
    sub: 架空の会社を想定した例です。実在の企業・実測値は含みません
    slides:

      - type: cover
        eyebrow: HR パートナー ご報告（見本）
        h3: 採用競合と現在地
        goal: 'これは<strong>架空の会社を想定した見本</strong>です。実際にはご商談の前に、御社の求人と競合の求人を実際に開いて確かめたものをお持ちします。'
        foot: 架空の例 ／ 実在の企業・実測値は含みません

      - eyebrow: 調べ方
        h3: 調査の範囲と方法
        blocks:
          - kind: lead
            text: '何を見て、どこから取ったかを<span class="q">1枚目に必ず書きます</span>。数字だけを渡さず、<span class="w">その数字がどこから来たか</span>を添えます。'
          - kind: method
            items:
              - {v: '5', u: 社, act: 同じ求職者を取り合っている同業を、求職者が見る検索画面から特定, src: 求人媒体の検索結果（架空の例）}
              - {v: '20', u: 件, act: 求人票を個別に開き、給与・休日・手当・保証を同じ表に転記, src: 求人媒体／各社の採用ページ（架空の例）}
              - {v: '3', u: 通り, act: 職種×地域で検索し、御社が何番目に出るかを実測, src: 検索語3種（架空の例）}
              - {v: '2', u: 本, act: 制度・単価の根拠を、所管省庁の通知そのもので確認, src: 官公庁の公開資料（架空の例）}
          - kind: note
            text: '取れなかった項目は<b>「未取得」と書きます</b>。埋めません。順位や検索ボリュームは、<b>いつ・どこから調べたか</b>で変わるため、取得日・地域を必ず添えます。'

      - eyebrow: 気づき ／ 条件の並び
        h3: 同じ物差しで並べる
        blocks:
          - kind: lead
            text: '条件は<span class="q">同じ表に並べて初めて</span>比べられます。バラバラの表記を、同じ単位に直してから置きます。'
          - kind: table
            head: [会社, 月給の下限, 休日, 資格手当]
            rows:
              - tone: self
                cells: ['<b>御社（架空）</b>', '<b>21.0 万円</b>', '<b>週休2日</b>', '<b>あり</b>']
              - cells: [A社, 22.5 万円, 週休2日, あり]
              - cells: [B社, 23.0 万円, シフト制, あり]
              - tone: warn
                cells: [C社, 24.0 万円, 完全週休2日, あり（上限なし）]
              - cells: [D社, 21.5 万円, シフト制, 記載なし]
          - kind: note
            text: 'この表は<b>架空の数値</b>です。実際のご報告では、各社の求人票を開いた日付と媒体名を各行に添えます。<br>条件で負けている項目が見つかった場合、<b>それは経営判断の材料</b>としてお渡しします。条件を動かすかどうかは御社が決めることです。'
          - kind: footnote
            text: '※ 架空の例です。効果をお約束するものではありません。実際の調査では、取得日・媒体名・検索条件を各数値に添えます。'

sources_in_slides: true

sources: |
  <b>この資料は見本です。</b>掲載している社名（A社〜D社）・金額・件数・順位は<b>すべて架空</b>で、
  実在の企業や実測値を一切含みません。効果をお約束するものでもありません。<br>
  <b>実際のご報告では</b>、ここに開いた求人票の URL・媒体名・取得日を1件ずつ列挙します
  （順位は端末・地域・ログイン状態で変わるため、取得条件を必ず添えます）。
  取れなかった項目は「未取得」と明記し、推測で埋めません。<br>
  作成：株式会社robottte ／ HRパートナー
